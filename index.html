<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEAH Korucuk Navigasyon</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .hospital-title { font-size: 13px; color: #718096; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    
    /* Arama Kutusu & Kısayollar */
    .search-box { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
    .search-box:focus { border-color: #3182ce; }
    .quick-buttons { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .quick-btn { background: #edf2f7; color: #2d3748; border: none; padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 20px; cursor: pointer; }
    .quick-btn:active { background: #cbd5e0; }

    .divider { height: 1px; background: #e2e8f0; border: none; margin: 15px 0; }
    
    .target-title { font-size: 18px; color: #1a202c; font-weight: 700; margin-bottom: 10px; }
    .icon-box { font-size: 80px; margin: 10px 0; min-height: 90px; display: flex; align-items: center; justify-content: center; }
    .step-title { font-size: 20px; font-weight: 800; color: #2b6cb0; margin-bottom: 8px; }
    .step-desc { font-size: 14px; color: #4a5568; line-height: 1.5; min-height: 45px; }
    .meter-badge { display: inline-block; background: #feebc8; color: #c05621; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 20px; margin-top: 10px; }
    
    .btn { background: #3182ce; color: white; border: none; padding: 15px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 20px; width: 100%; }
    .btn:active { background: #2b6cb0; }
  </style>
</head>
<body>

  <div class="card">
    <div class="hospital-title">SEAH KORUCUK KAMPÜSÜ</div>
    
    <!-- Kullanıcının Oda Arayacağı Kutucuk -->
    <input type="text" id="search-input" class="search-box" placeholder="Oda / Poliklinik adı yazın (Örn: Göz)" oninput="filterSearch()">
    <datalist id="route-list"></datalist>

    <!-- Hızlı Kısayol Butonları -->
    <div class="quick-buttons">
      <button class="quick-btn" onclick="startRoute('wc')">🚻 WC</button>
      <button class="quick-btn" onclick="startRoute('asansor')">🛗 Asansör</button>
      <button class="quick-btn" onclick="startRoute('goz_olcum')">👁️ Göz Ölçüm</button>
    </div>

    <hr class="divider">

    <div id="target-name" class="target-title">Hedef Seçin</div>
    <div id="icon" class="icon-box">🗺️</div>
    <div id="title" class="step-title">Nereye Gitmek İstiyorsunuz?</div>
    <div id="desc" class="step-desc">Yukarıdan oda arayabilir veya hızlı butonları kullanabilirsiniz.</div>
    <div id="meter" class="meter-badge" style="display:none;">-- Metre</div>
    
    <button id="next-btn" class="btn" style="display:none;" onclick="nextStep()">Sonraki Adım ➔</button>
  </div>

  <script>
    let allRoutes = {};
    let currentStepIndex = 0;
    let routeSteps = [];

    // JSON Dosyasından Verileri Çek
    fetch('routes.json')
      .then(res => res.json())
      .then(data => {
        allRoutes = data;
        
        // Arama kutusu için öneri listesini doldur
        const datalist = document.getElementById('route-list');
        
        // URL'den parametre gelmişse (QR kod ile girildiyse)
        const urlParams = new URLSearchParams(window.location.search);
        const targetKey = urlParams.get('hedef');
        if (targetKey && allRoutes[targetKey]) {
          startRoute(targetKey);
        }
      });

    // Kullanıcı Arama Kutusu İçi Arama
    function filterSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      for (let key in allRoutes) {
        if (allRoutes[key].target_name.toLowerCase().includes(query) && query.length > 2) {
          startRoute(key);
          break;
        }
      }
    }

    // Rotayı Başlat
    function startRoute(key) {
      if (!allRoutes[key]) return;
      
      const route = allRoutes[key];
      document.getElementById('target-name').innerText = route.target_name;
      routeSteps = route.steps;
      currentStepIndex = 0;
      
      document.getElementById('next-btn').style.display = "block";
      renderStep();
    }

    // Adımları Ekrana Bas
    function renderStep() {
      const step = routeSteps[currentStepIndex];
      document.getElementById('icon').innerText = step.icon;
      document.getElementById('title').innerText = step.title;
      document.getElementById('desc').innerText = step.description;
      
      const meterElem = document.getElementById('meter');
      if (step.distance_m > 0) {
        meterElem.style.display = "inline-block";
        meterElem.innerText = `Mesafe: ~${step.distance_m} Metre`;
      } else {
        meterElem.style.display = "none";
      }

      const btn = document.getElementById('next-btn');
      if (currentStepIndex === routeSteps.length - 1) {
        btn.innerText = "Navigasyonu Tamamla";
        btn.style.background = "#38a169";
      } else {
        btn.innerText = "Sonraki Adım ➔";
        btn.style.background = "#3182ce";
      }
    }

    function nextStep() {
      if (currentStepIndex < routeSteps.length - 1) {
        currentStepIndex++;
        renderStep();
      } else {
        alert("Hedefe ulaştınız!");
      }
    }
  </script>
</body>
</html>
